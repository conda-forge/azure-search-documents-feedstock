schema_version: 1

context:
  name: azure-search-documents
  version: 12.1.0

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: ba4694c321cd9318ed02dea9078d4fa2f582ae93a33e800c7d7b8f99cb95ac6e

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - typing_extensions >=4.6.0
    - python >=${{ python_min }}
    - azure-core >=1.37.0
    - isodate >=0.6.1
tests:
  - python:
      imports:
        - azure.search.documents
      pip_check: true
      python_version:
        - ${{ python_min }}
        - '*'

about:
  summary: Microsoft Azure Cognitive Search Client Library for Python
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/Azure/azure-sdk-for-python/tree/main/sdk/search/azure-search-documents

extra:
  recipe-maintainers:
    - jan-janssen
